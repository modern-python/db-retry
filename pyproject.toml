[project]
name = "db-retry"
description = "Retry helpers for PostgreSQL / SQLAlchemy database operations"
authors = [
    { name = "Artur Shiriev", email = "me@shiriev.ru" },
]
readme = "README.md"
requires-python = ">=3.11,<4"
license = "MIT"
keywords = ["postgresql", "sqlalchemy", "retry", "database", "asyncio", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
]
version = "0.0.0"
dependencies = [
    "tenacity",
    "sqlalchemy[asyncio]",
    "asyncpg",
]

[project.urls]
Homepage = "https://modern-python.org"
Repository = "https://github.com/modern-python/db-retry"
Issues = "https://github.com/modern-python/db-retry/issues"
Changelog = "https://github.com/modern-python/db-retry/releases"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "advanced-alchemy",
]
lint = [
    "ruff",
    "ty",
    "eof-fixer",
    "asyncpg-stubs",
]

[build-system]
requires = ["uv_build>=0.11,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "db_retry"
module-root = ""

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",     # docstrings are not forced; a docstring exists when it says something
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "CPY001", # no per-file copyright header
    "FBT",    # boolean positional arguments are fine
    "TCH",    # imports stay real; TYPE_CHECKING-only imports break runtime introspection
]
isort.lines-after-imports = 2
isort.no-lines-before = ["standard-library", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
addopts = ""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 100
exclude_also = [
    "if typing.TYPE_CHECKING:",
]
